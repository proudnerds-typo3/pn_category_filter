<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:pn="http://typo3.org/ns/ProudNerds/PnCategoryFilter/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{records}">
    <f:then>
        <h2 class="pn-category-filter__results-title" data-results-title>
            <f:translate key="LLL:EXT:pn_category_filter/Resources/Private/Language/locallang.xlf:results.title" />
        </h2>

        <p class="pn-category-filter__count" {f:if(condition: '{selectedCategories} || {activeSearchTerm} || {hasActiveFieldFilters}' , then: 'role="status"' )}>
            <f:if condition="{totalRecords} == 1">
                <f:then><f:translate key="LLL:EXT:pn_category_filter/Resources/Private/Language/locallang.xlf:results.countSingular" arguments="{0: totalRecords}" /></f:then>
                <f:else><f:translate key="LLL:EXT:pn_category_filter/Resources/Private/Language/locallang.xlf:results.count" arguments="{0: totalRecords}" /></f:else>
            </f:if>
        </p>

        <div class="pn-category-filter__items">
            <f:for each="{records}" as="record">
                <article class="pn-category-filter__item" data-table="{record._tableName}" data-uid="{record.uid}">
                    <header>
                        <f:variable name="recordTitle" value="{f:if(condition: record.title, then: record.title, else: record.header)}" />
                        <f:if condition="{recordTitle}">
                            <h3 class="pn-category-filter__item-title">
                                <f:if condition="{record._link}">
                                    <f:then><f:link.typolink parameter="{record._link}" class="pn-category-filter__item-link">{recordTitle}</f:link.typolink></f:then>
                                    <f:else>{recordTitle}</f:else>
                                </f:if>
                            </h3>
                        </f:if>
                    </header>

                    <f:if condition="{record.crdate}">
                        <p class="pn-category-filter__item-date">
                            <f:format.date format="d-m-Y">{record.crdate}</f:format.date>
                        </p>
                    </f:if>

                    <f:variable name="previewText" value="{f:if(condition: record.abstract, then: record.abstract, else: record.description)}" />
                    <f:variable name="previewText" value="{f:if(condition: record.teaser, then: record.teaser, else: previewText)}" />
                    <f:if condition="{previewText}">
                        <div class="pn-category-filter__item-text pn-category-filter__item-text--preview">
                            <pn:highlightSearchTerm searchTerm="{activeSearchTerm}" stripTags="1">
                                {previewText -> f:format.crop(maxCharacters: '{settings.textCropLength}', respectWordBoundaries: '1', append: '…')}
                            </pn:highlightSearchTerm>
                        </div>
                    </f:if>
                </article>
            </f:for>
        </div>

        <f:if condition="{paginator.numberOfPages} > 1">
            <f:render partial="Pagination" arguments="{pagination: pagination, paginator: paginator, paginationArguments: paginationArguments, ttContentUid: ttContentUid}" />
        </f:if>
    </f:then>
    <f:else>
        <div class="pn-category-filter__empty">
            <p>
                <f:translate key="LLL:EXT:pn_category_filter/Resources/Private/Language/locallang.xlf:results.empty" />
            </p>
        </div>
    </f:else>
</f:if>

</html>
